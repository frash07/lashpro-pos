# fly.toml app configuration file generated for lashpro-pos on 2026-11-20T12:10:08Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'lashpro-pos'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'bash release.sh'

[env]
  ALLOWED_HOSTS = 'pos.lashproke.cc,lashpro-pos.fly.dev'
  AXES_IPWARE_PROXY_COUNT = '1'
  CSRF_COOKIE_SECURE = 'true'
  CSRF_TRUSTED_ORIGINS = 'https://pos.lashproke.cc,https://lashpro-pos.fly.dev'
  DB_CONN_MAX_AGE = '0'
  DB_DISABLE_SERVER_SIDE_CURSORS = 'true'
  DEBUG = 'false'
  DJANGO_ENV = 'production'
  LOG_LEVEL = 'INFO'
  PORT = '8080'
  POS_BASE_URL = 'https://pos.lashproke.cc'
  STOREFRONT_BASE_URL = 'https://lashproke.cc'
  POS_HOSTS = 'pos.lashproke.cc,lashpro-pos.fly.dev'
  SECURE_HSTS_INCLUDE_SUBDOMAINS = 'false'
  SECURE_HSTS_PRELOAD = 'false'
  SECURE_HSTS_SECONDS = '300'
  SECURE_SSL_REDIRECT = 'true'
  SESSION_COOKIE_SECURE = 'true'
  SYNTHETIC_DATA_ENABLED = 'false'
  TRUST_PROXY_SSL_HEADER = 'true'

# Dedicated reservation expiry worker; scale scheduler=1 and verify after deploy.
[processes]
  app = 'gunicorn config.wsgi:application --bind 0.0.0.0:8080 --workers 1 --threads 2 --access-logfile - --access-logformat "%(m)s %(s)s %(D)s" --error-logfile -'
  scheduler = 'bash scripts/reservation_scheduler.sh'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 2
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/readyz'

    [http_service.checks.headers]
      Host = 'lashpro-pos.fly.dev'
      X-Forwarded-Proto = 'https'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
