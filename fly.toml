# fly.toml app configuration file generated for lashpro-pos on 2026-11-15T02:17:09Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'lashpro-pos'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'bash release.sh'

[env]
  ALLOWED_HOSTS = 'lashpro-pos.fly.dev'
  AXES_IPWARE_PROXY_COUNT = '1'
  CSRF_COOKIE_SECURE = 'true'
  CSRF_TRUSTED_ORIGINS = 'https://lashpro-pos.fly.dev'
  DB_CONN_MAX_AGE = '0'
  DB_DISABLE_SERVER_SIDE_CURSORS = 'true'
  DEBUG = 'false'
  DJANGO_ENV = 'production'
  SYNTHETIC_DATA_ENABLED = 'false'
  LOG_LEVEL = 'INFO'
  PORT = '8080'
  POS_HOSTS = 'lashpro-pos.fly.dev'
  POS_BASE_URL = 'https://lashpro-pos.fly.dev'
  SECURE_HSTS_INCLUDE_SUBDOMAINS = 'false'
  SECURE_HSTS_PRELOAD = 'false'
  SECURE_HSTS_SECONDS = '300'
  SECURE_SSL_REDIRECT = 'true'
  SESSION_COOKIE_SECURE = 'true'
  TRUST_PROXY_SSL_HEADER = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/accounts/login/'

    [http_service.checks.headers]
      Host = 'lashpro-pos.fly.dev'
      X-Forwarded-Proto = 'https'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
