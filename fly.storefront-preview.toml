# Isolated storefront preview. Never point this app at the pilot database.
app = 'lashpro-storefront-preview'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'bash release.sh'

[env]
  ALLOWED_HOSTS = 'lashpro-storefront-preview.fly.dev'
  AXES_IPWARE_PROXY_COUNT = '1'
  CSRF_COOKIE_SECURE = 'true'
  CSRF_TRUSTED_ORIGINS = 'https://lashpro-storefront-preview.fly.dev'
  DB_CONN_MAX_AGE = '0'
  DB_DISABLE_SERVER_SIDE_CURSORS = 'true'
  DEBUG = 'false'
  DJANGO_ENV = 'synthetic-test'
  LOG_LEVEL = 'INFO'
  PORT = '8080'
  POS_BASE_URL = 'https://lashpro-storefront-preview.fly.dev'
  STOREFRONT_BASE_URL = 'https://lashpro-storefront-preview.fly.dev'
  POS_HOSTS = 'lashpro-pos.fly.dev'
  SECURE_HSTS_INCLUDE_SUBDOMAINS = 'false'
  SECURE_HSTS_PRELOAD = 'false'
  SECURE_HSTS_SECONDS = '31536000'
  SECURE_SSL_REDIRECT = 'true'
  SESSION_COOKIE_SECURE = 'true'
  SYNTHETIC_DATA_ENABLED = 'true'
  TRUST_PROXY_SSL_HEADER = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/readyz'

    [http_service.checks.headers]
      Host = 'lashpro-storefront-preview.fly.dev'
      X-Forwarded-Proto = 'https'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
