<form method="post" class="operation-review register-form">{% csrf_token %}<input type="hidden" name="payout_type" value="{{ payout_type }}"><input type="hidden" name="payout_id" value="{{ payout.pk }}"><div class="register-field"><label for="reason-{{ payout_type }}-{{ payout.pk }}">Statement match or rejection reason</label><textarea id="reason-{{ payout_type }}-{{ payout.pk }}" name="reason" required maxlength="500" rows="3"></textarea></div><div class="operation-actions"><button class="product-button primary" type="submit" name="decision" value="CONFIRMED">Confirm payout</button><button class="product-button danger" type="submit" name="decision" value="REJECTED">Reject reference</button></div></form>
