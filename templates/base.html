{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e6317d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>{% block title %}LashPro POS{% endblock %}</title>
  <link rel="manifest" href="{% static 'pwa/manifest.webmanifest' %}">
  <link rel="icon" type="image/png" sizes="48x48" href="{% static 'pwa/favicon-48.png' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'pwa/favicon-32.png' %}">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'pwa/icon-192.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'pwa/icon-180.png' %}">
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/legacy.css' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap">
  {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("{% url 'service_worker' %}", { scope: "/" })
          .catch((error) => console.warn("LashPro offline support could not be enabled.", error));
      });
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
