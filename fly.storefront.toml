# Production storefront Fly app configuration.
# Keep fly.toml for the lashpro-pos app and fly.storefront-preview.toml for the isolated synthetic preview.
# Deploy this app with: fly deploy --config fly.storefront.toml

# fly.toml app configuration file generated for lashpro-storefront on 2026-11-20T12:14:48Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'lashpro-storefront'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

# Schema migrations are run once by the POS release. The storefront must not
# run a second independent migration command against the shared Neon branch.

[env]
  ALLOWED_HOSTS = 'lashproke.cc,lashpro-storefront.fly.dev'
  AXES_IPWARE_PROXY_COUNT = '1'
  CSRF_COOKIE_SECURE = 'true'
  CSRF_TRUSTED_ORIGINS = 'https://lashproke.cc,https://lashpro-storefront.fly.dev'
  DB_CONN_MAX_AGE = '0'
  DB_DISABLE_SERVER_SIDE_CURSORS = 'true'
  DEBUG = 'false'
  DJANGO_ENV = 'production'
  LOG_LEVEL = 'INFO'
  PORT = '8080'
  POS_BASE_URL = 'https://pos.lashproke.cc'
  STOREFRONT_BASE_URL = 'https://lashproke.cc'
  POS_HOSTS = 'pos.lashproke.cc,lashpro-pos.fly.dev'
  SECURE_HSTS_INCLUDE_SUBDOMAINS = 'false'
  SECURE_HSTS_PRELOAD = 'false'
  SECURE_HSTS_SECONDS = '300'
  SECURE_SSL_REDIRECT = 'true'
  SESSION_COOKIE_SECURE = 'true'
  SYNTHETIC_DATA_ENABLED = 'false'
  TRUST_PROXY_SSL_HEADER = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/readyz'

    [http_service.checks.headers]
      Host = 'lashpro-storefront.fly.dev'
      X-Forwarded-Proto = 'https'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
