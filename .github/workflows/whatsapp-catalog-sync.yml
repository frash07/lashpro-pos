name: WhatsApp catalogue synchronisation

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Queue every product for a full Meta catalogue reconciliation."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lashpro-whatsapp-catalog-sync
  cancel-in-progress: false

jobs:
  sync-catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200

      - name: Dispatch pending catalogue updates on the POS app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_POS_API_TOKEN }}
          FULL_SYNC: ${{ inputs.full_sync || 'false' }}
        run: |
          set -euo pipefail
          if [[ -z "${FLY_API_TOKEN:-}" ]]; then
            echo "FLY_POS_API_TOKEN is required to run the catalogue sync worker." >&2
            exit 1
          fi

          if [[ "$FULL_SYNC" == "true" ]]; then
            COMMAND="python manage.py sync_whatsapp_catalog --all-products"
          else
            COMMAND="python manage.py sync_whatsapp_catalog"
          fi

          flyctl ssh console --app lashpro-pos -C "$COMMAND"
