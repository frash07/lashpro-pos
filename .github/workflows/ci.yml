name: Django CI

on:
  push:
    branches: [main, "deployment/**", "flyio-new-files", "storefront"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lashpro_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lashpro_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-deployment-83f7b72e8d45e1ac
      DEBUG: "false"
      DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/lashpro_ci?sslmode=disable
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://localhost
      SECURE_SSL_REDIRECT: "false"
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SECURE: "false"
      DB_CONN_MAX_AGE: "0"
      DB_DISABLE_SERVER_SIDE_CURSORS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Django system checks
        run: python manage.py check
      - name: Production deployment checks
        run: |
          SECURE_SSL_REDIRECT=true \
          SECURE_HSTS_SECONDS=300 \
          SECURE_HSTS_INCLUDE_SUBDOMAINS=false \
          SECURE_HSTS_PRELOAD=false \
          SESSION_COOKIE_SECURE=true \
          CSRF_COOKIE_SECURE=true \
          python manage.py check --deploy
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations against fresh PostgreSQL
        run: python manage.py migrate --noinput
      - name: Build static assets
        run: python manage.py collectstatic --noinput
      - name: Run tests
        run: python manage.py test

      - name: Build production Docker image
        run: docker build --tag lashpro-pos:ci .

      # Optional preview deployment. The pilot Fly app is never targeted here.
      # Configure the repository secrets/variable documented in docs/STOREFRONT_PREVIEW.md.
      - name: Check storefront preview configuration
        if: github.ref == 'refs/heads/storefront'
        id: storefront-preview
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
          PREVIEW_DJANGO_SECRET_KEY: ${{ secrets.PREVIEW_DJANGO_SECRET_KEY }}
          PREVIEW_STAFF_PASSWORD: ${{ secrets.PREVIEW_STAFF_PASSWORD }}
        run: |
          missing=()
          for name in FLY_API_TOKEN PREVIEW_DATABASE_URL PREVIEW_DJANGO_SECRET_KEY PREVIEW_STAFF_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "::notice::Storefront preview not deployed. Configure repository secrets/variable: ${missing[*]}."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install flyctl
        if: steps.storefront-preview.outputs.configured == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy isolated storefront preview
        if: steps.storefront-preview.outputs.configured == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
          PREVIEW_DJANGO_SECRET_KEY: ${{ secrets.PREVIEW_DJANGO_SECRET_KEY }}
          PREVIEW_STAFF_PASSWORD: ${{ secrets.PREVIEW_STAFF_PASSWORD }}
        run: |
          set -euo pipefail
          APP="lashpro-storefront-preview"

          DATABASE_NAME="$(PREVIEW_DATABASE_URL="$PREVIEW_DATABASE_URL" python -c 'import os; from urllib.parse import urlparse; print(urlparse(os.environ["PREVIEW_DATABASE_URL"]).path.lstrip("/"))')"
          if [[ -z "$DATABASE_NAME" ]]; then
            echo "Could not determine the preview database name from PREVIEW_DATABASE_URL." >&2
            exit 1
          fi

          flyctl secrets set --app "$APP" \
            DJANGO_SECRET_KEY="$PREVIEW_DJANGO_SECRET_KEY" \
            DATABASE_URL="$PREVIEW_DATABASE_URL" \
            SYNTHETIC_DATA_CONFIRM_DATABASE="$DATABASE_NAME" \
            SYNTHETIC_STAFF_PASSWORD="$PREVIEW_STAFF_PASSWORD"

          flyctl deploy --config fly.storefront-preview.toml --app "$APP" --remote-only --ha=false
