name: Django CI

on:
  push:
    branches: [main, "deployment/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lashpro_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lashpro_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-deployment-83f7b72e8d45e1ac
      DEBUG: "false"
      DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/lashpro_ci?sslmode=disable
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://localhost
      SECURE_SSL_REDIRECT: "false"
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SECURE: "false"
      DB_CONN_MAX_AGE: "0"
      DB_DISABLE_SERVER_SIDE_CURSORS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Django system checks
        run: python manage.py check
      - name: Production deployment checks
        run: |
          SECURE_SSL_REDIRECT=true \
          SECURE_HSTS_SECONDS=300 \
          SECURE_HSTS_INCLUDE_SUBDOMAINS=false \
          SECURE_HSTS_PRELOAD=false \
          SESSION_COOKIE_SECURE=true \
          CSRF_COOKIE_SECURE=true \
          python manage.py check --deploy
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations against fresh PostgreSQL
        run: python manage.py migrate --noinput
      - name: Build static assets
        run: python manage.py collectstatic --noinput
      - name: Run tests
        run: python manage.py test
