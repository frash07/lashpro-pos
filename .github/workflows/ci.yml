name: Django CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Deploy the production POS and storefront after CI succeeds."
        required: false
        type: boolean
        default: false

# Keep main releases serialized across workflow runs as well as within each run.
# This protects the shared production database from overlapping migration steps.
permissions:
  contents: read

concurrency:
  group: lashpro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lashpro_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lashpro_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-deployment-83f7b72e8d45e1ac
      DEBUG: "false"
      DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/lashpro_ci?sslmode=disable
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://localhost
      SECURE_SSL_REDIRECT: "false"
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SECURE: "false"
      DB_CONN_MAX_AGE: "0"
      DB_DISABLE_SERVER_SIDE_CURSORS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Enforce token-only CSS theme values in changed styles
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python scripts/check_css_tokens.py
      - name: Enforce POS token ownership and semantic consumers
        run: python scripts/check_pos_css_contract.py
      - name: Django system checks
        run: python manage.py check
      - name: Production deployment checks
        run: |
          SECURE_SSL_REDIRECT=true \
          SECURE_HSTS_SECONDS=300 \
          SECURE_HSTS_INCLUDE_SUBDOMAINS=false \
          SECURE_HSTS_PRELOAD=false \
          SESSION_COOKIE_SECURE=true \
          CSRF_COOKIE_SECURE=true \
          TRUST_PROXY_SSL_HEADER=true \
          DJANGO_ENV=production \
          DATABASE_URL=postgresql://ci:ci@ep-ci.neon.tech:5432/lashpro_ci?sslmode=require \
          DB_CONN_MAX_AGE=0 \
          DB_DISABLE_SERVER_SIDE_CURSORS=true \
          CLOUDINARY_URL=cloudinary://ci:ci@lashpro-ci \
          python manage.py check --deploy
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations against fresh PostgreSQL
        run: python manage.py migrate --noinput
      - name: Build static assets
        run: python manage.py collectstatic --noinput
      - name: Run tests
        run: python manage.py test

      - name: Build production Docker image
        run: docker build --tag lashpro-pos:ci .

      # Optional preview deployment. The pilot Fly app is never targeted here.
      # Configure the repository secrets/variable documented in docs/STOREFRONT_PREVIEW.md.
      - name: Check storefront preview configuration
        if: github.ref == 'refs/heads/main'
        id: storefront-preview
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
          PREVIEW_DJANGO_SECRET_KEY: ${{ secrets.PREVIEW_DJANGO_SECRET_KEY }}
          PREVIEW_STAFF_PASSWORD: ${{ secrets.PREVIEW_STAFF_PASSWORD }}
        run: |
          missing=()
          for name in FLY_API_TOKEN PREVIEW_DATABASE_URL PREVIEW_DJANGO_SECRET_KEY PREVIEW_STAFF_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "::notice::Storefront preview not deployed. Configure repository secrets/variable: ${missing[*]}."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install flyctl
        if: steps.storefront-preview.outputs.configured == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200

      - name: Deploy isolated storefront preview
        if: steps.storefront-preview.outputs.configured == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
          PREVIEW_DJANGO_SECRET_KEY: ${{ secrets.PREVIEW_DJANGO_SECRET_KEY }}
          PREVIEW_STAFF_PASSWORD: ${{ secrets.PREVIEW_STAFF_PASSWORD }}
        run: |
          set -euo pipefail
          APP="lashpro-storefront-preview"

          DATABASE_NAME="$(PREVIEW_DATABASE_URL="$PREVIEW_DATABASE_URL" python -c 'import os; from urllib.parse import urlparse; print(urlparse(os.environ["PREVIEW_DATABASE_URL"]).path.lstrip("/"))')"
          if [[ -z "$DATABASE_NAME" ]]; then
            echo "Could not determine the preview database name from PREVIEW_DATABASE_URL." >&2
            exit 1
          fi

          flyctl secrets set --app "$APP" \
            DJANGO_SECRET_KEY="$PREVIEW_DJANGO_SECRET_KEY" \
            DATABASE_URL="$PREVIEW_DATABASE_URL" \
            SYNTHETIC_DATA_CONFIRM_DATABASE="$DATABASE_NAME" \
            SYNTHETIC_STAFF_PASSWORD="$PREVIEW_STAFF_PASSWORD"

          flyctl deploy --config fly.storefront-preview.toml --app "$APP" --remote-only --ha=false

      # Production is opt-in: pushing to main runs checks but never releases.
      # Dispatch this workflow from main with deploy_production=true only after
      # backup, infrastructure, and business release gates have been approved.
      - name: Check production deployment configuration
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_production == true
        id: production-deployment
        env:
          FLY_POS_API_TOKEN: ${{ secrets.FLY_POS_API_TOKEN }}
          FLY_STOREFRONT_API_TOKEN: ${{ secrets.FLY_STOREFRONT_API_TOKEN }}
        run: |
          missing=()
          for name in FLY_POS_API_TOKEN FLY_STOREFRONT_API_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::Production deployment requested but required repository secrets are missing: ${missing[*]}."
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install flyctl for production
        if: steps.production-deployment.outputs.configured == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200

      - name: Deploy production POS, then storefront from main
        if: steps.production-deployment.outputs.configured == 'true'
        env:
          FLY_POS_API_TOKEN: ${{ secrets.FLY_POS_API_TOKEN }}
          FLY_STOREFRONT_API_TOKEN: ${{ secrets.FLY_STOREFRONT_API_TOKEN }}
        run: |
          set -euo pipefail
          export FLY_API_TOKEN="$FLY_POS_API_TOKEN"
          flyctl deploy --config fly.toml --app lashpro-pos --remote-only
          export FLY_API_TOKEN="$FLY_STOREFRONT_API_TOKEN"
          flyctl deploy --config fly.storefront.toml --app lashpro-storefront --remote-only
